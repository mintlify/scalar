name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter './packages/*' build
      - name: Type check openapi-parser
        run: pnpm --filter @mintlify/openapi-parser types:check
      - name: Test openapi-parser
        run: pnpm --filter @mintlify/openapi-parser exec vitest run src
